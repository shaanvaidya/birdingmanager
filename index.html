<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>San Francisco Bird Sightings</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
        background-color: #f8f7f4;
        color: #1d1d1f;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
      }

      main {
        max-width: 560px;
        width: 100%;
        background: #ffffff;
        border-radius: 20px;
        padding: 32px;
        box-shadow: 0 20px 60px rgba(30, 30, 30, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 24px;
        color: #555;
        line-height: 1.5;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 12px;
      }

      li {
        background: #f2f4f8;
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Birds seen in San Francisco</h1>
      <p>A simple list of birds recently spotted around the city.</p>
      <ul>
        <li>Dummy Bird 001</li>
        <li>Dummy Bird 002</li>
        <li>Dummy Bird 003</li>
        <li>Dummy Bird 004</li>
        <li>Dummy Bird 005</li>
        <li>Dummy Bird 006</li>
        <li>Dummy Bird 007</li>
        <li>Dummy Bird 008</li>
      </ul>
    </main>
  </body>
</html>
